name: Backup D1 to R2

on:
  schedule:
    # Every Sunday at 03:00 UTC.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export D1 database
        run: npx wrangler d1 export DB --remote --output=backup.sql --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload backup to R2
        run: |
          STAMP="$(date -u +%Y-%m-%d_%H%M%S)"
          npx wrangler r2 object put "paths-of-revelation-files/backups/paths-of-revelation-${STAMP}.sql" --file=backup.sql --remote --content-type=application/sql --force
          npx wrangler r2 object put "paths-of-revelation-files/backups/latest.sql" --file=backup.sql --remote --content-type=application/sql --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
